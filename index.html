<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vitres Pro"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0a5fd0">
<title>Vitres Pro – Gestion auto-entrepreneur</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--bg:#d9edf5;--sf:#f7fcfe;--ink:#06214a;--mu:#34557a;--ln:#9fc6dc;--tl:#0a5fd0;--tlt:#fff;--ye:#3cc4ff;--rd:#b3261e;--gn:#17703f;--or:#a14a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061327;--sf:#0e2447;--ink:#eef7ff;--mu:#a9c4e6;--ln:#24467a;--tl:#4db8ff;--tlt:#03142e;--ye:#3cc4ff;--rd:#ff9a90;--gn:#6fdc9e;--or:#ffb454}}
:root[data-theme="dark"]{--bg:#061327;--sf:#0e2447;--ink:#eef7ff;--mu:#a9c4e6;--ln:#24467a;--tl:#4db8ff;--tlt:#03142e;--ye:#3cc4ff;--rd:#ff9a90;--gn:#6fdc9e;--or:#ffb454}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-style:italic;font-weight:800;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--sf);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--ln)}
nav a{padding:6px 2px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:700;font-size:12px;text-align:center}nav a span{display:block;font-size:24px;line-height:1.2}
nav a.on{background:var(--tl);color:var(--tlt)}
main{max-width:720px;margin:0 auto;padding:14px 14px 150px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:linear-gradient(120deg,#3cc4ff 0,#0a63d1 52%,#06358f 100%);color:#fff;border:0;position:relative;overflow:hidden}.hero::after{content:"";position:absolute;top:0;bottom:0;right:24%;width:34px;background:rgba(255,255,255,.2);transform:skewX(-20deg)}
.hero .big{font-size:44px;font-weight:800;line-height:1.05}
.mu{color:var(--mu);font-size:15px}.hero .mu{color:inherit;opacity:.85}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.item{padding:12px 0;border-top:1px solid var(--ln)}.item:first-child{border-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:12px 16px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-block}
button.p,.btn.p{background:var(--tl);color:var(--tlt);border-color:var(--tl)}
button.d{color:var(--rd)}
button.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ye);color:#06214a;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 20px;border-radius:99px;z-index:6}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--ln)}
.chip.w{border-color:var(--rd);color:var(--rd)}.chip.g{border-color:var(--gn);color:var(--gn)}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ye)}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px}
textarea{min-height:90px}
#mo{position:fixed;inset:0;background:rgba(5,20,25,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#mo[hidden]{display:none}
.sheet{background:var(--sf);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--ln)}td.r,th.r{text-align:right}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button.on{background:var(--ink);color:var(--bg)}
.ck{display:flex;gap:10px;align-items:flex-start}.ck input{width:22px;height:22px;margin:2px 0 0;flex:none}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin:0 -6px}.cal small{color:var(--mu);font-weight:800;padding:4px 0}
.t{display:block;font-size:10px;line-height:1.1;font-weight:800;border-radius:4px;padding:3px 1px;overflow:hidden;word-break:break-word;text-align:center}
.t.r{background:var(--tl);color:var(--tlt)}.t.d{background:var(--or);color:var(--tlt)}.t.o{background:var(--mu);color:var(--sf)}.t.f{background:var(--rd);color:var(--tlt)}
.t.lg{display:inline-block;font-size:13px;padding:4px 9px;margin:0 6px 6px 0;border-radius:8px}
.t.y{background:var(--ye);color:#06214a}
.map{width:100%;height:auto;display:block}.map line{stroke:var(--ln);stroke-width:1}.map text{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--sf);stroke-width:3px;stroke-linejoin:round}.map image{pointer-events:none}.map .pin{stroke:#fff;stroke-width:3}.pin.d{fill:var(--or)}.pin.y{fill:var(--ye)}.pin.r{fill:var(--tl)}.map .sb{stroke:var(--ink);stroke-width:3}.map g{cursor:pointer}
.day{padding:4px 1px;min-height:96px;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:8px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px}.day em{font-style:normal;font-weight:800;font-size:16px;text-align:center}
.day.today{border:2px solid var(--tl)}.day.today em{color:var(--tl)}.day.sel{outline:3px solid var(--ink);outline-offset:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tl)}.dot.d{background:var(--or)}.dot.o{background:var(--mu)}.dot.f{background:var(--rd)}.day.sel .dot.r{background:var(--tlt)}
@media print{body>*:not(#mo){display:none!important}#mo{position:static;background:none;display:block}.sheet{max-height:none;border-radius:0;color:#000}.acts{display:none}}
</style></head><body>
<nav id="nav"></nav><main id="v"></main><div id="mo" hidden></div>

const DEF={cl:[],rdv:[],fa:[],de:[],ck:{},st:{nom:'',ent:'',siret:'',adr:'',tel:'',mail:'',iban:'',freq:'m',taux:21.2,plaf:77700,tva:37500,cat:'Vitres maison;60\nVitres appartement;40\nVéranda;120\nVelux (par fenêtre);15\nDevanture / commerce;90\nRemise en état après travaux;200',n:1}};
let S,tab='home',sub='fa',RL={t:0,c:'',f:''};

const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const td=()=>iso(new Date()),pad=n=>String(n).padStart(2,'0');
const fd=s=>s?new Date((s.length>10?s:s+'T12:00')).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'';
const uid=()=>Math.random().toString(36).slice(2,9);

const tot=f=>f.l.reduce((a,x)=>a+x.q*x.p,0);
const caR=(a,b)=>S.fa.filter(f=>f.s=='p'&&f.dp>=a&&f.dp<=b).reduce((s,f)=>s+tot(f),0);

const cat=()=>S.st.cat.split('\n').map(l=>l.split(';')).filter(a=>a[0].trim());
const inp=(n,l,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${e(v)}" ${x}></label>`;
const sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(a=>{a=[].concat(a);const k=a[0],t=a[1]??a[0];return`<option value="${e(k)}"${k==v?' selected':''}>${e(t)}</option>`}).join('')}</select></label>`;
const cSel=(v)=>sel('c','Client',[['','— choisir —']].concat(S.cl.map(c=>[c.id,c.nom])),v);
function modal(h,fn){const m=$('#mo');m.innerHTML=`<div class="sheet">${h}</div>`;m.hidden=false;const f=m.querySelector('form');if(f)f.onsubmit=ev=>{ev.preventDefault();fn(Object.fromEntries(new FormData(f)));shut()};return m}

/* ---------- échéance de déclaration ---------- */
function nd(){const n=new Date(),y=n.getFullYear(),mo=n.getMonth();let dl,a,b;
if(S.st.freq!='t'){dl=new Date(y,mo+1,0,23,59);a=new Date(y,mo-1,1);b=new Date(y,mo,0)}
else{const L=[];[y,y+1].forEach(Y=>[[0,31],[3,30],[6,31],[9,31]].forEach(([m,d])=>L.push([Y,m,d])));
const [Y,m,d]=L.find(([Y,m,d])=>new Date(Y,m,d,23,59)>=n);dl=new Date(Y,m,d,23,59);a=new Date(Y,m-3,1);b=new Date(Y,m,0)}
return{dl,a:iso(a),b:iso(b),days:Math.ceil((dl-n)/864e5),key:'d'+iso(dl)}}

<div class="card"><div class="row"><b>Chiffre d’affaires ${y}</b><span>${eur(caY)}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="mu">${Math.round(p)} % du plafond (${eur(s.plaf)})${caY>s.tva?' · seuil de TVA dépassé : vérifiez votre situation':caY>s.tva*.85?' · proche du seuil de TVA ('+eur(s.tva)+')':''}</div></div>

function vOb(){const d=nd(),n=new Date(),y=n.getFullYear(),ms=y+'-'+pad(n.getMonth()+1),ck=k=>`<input type="checkbox" data-a="ck" data-id="${k}"${S.ck[k]?' checked':''}>`;
const mt=[['recettes','Mettre à jour le livre des recettes','Chaque encaissement : date, client, montant, mode de paiement.'],['achats','Classer factures et justificatifs d’achats',''],['imp','Relancer les impayés','Onglet Relances.']];
return`<h2>Obligations</h2><div class="card"><div class="row"><b>Déclaration de CA</b><span class="chip ${d.days<=7?'w':''}">J-${Math.max(d.days,0)}</span></div><div class="ck item"><label style="margin:0" class="ck">${ck(d.key)}<span>Déclarer le CA avant le <b>${fd(iso(d.dl))}</b><br><span class="mu">Du ${fd(d.a)} au ${fd(d.b)} : <b>${eur(caR(d.a,d.b))}</b>. À faire même si le CA est à 0 €. Sur autoentrepreneur.urssaf.fr, le paiement suit la déclaration.</span></span></label></div></div>
<div class="card"><b>Ce mois-ci</b>${mt.map(m=>`<div class="item"><label style="margin:0" class="ck">${ck('m'+ms+m[0])}<span>${m[1]}<br><span class="mu">${m[2]}</span></span></label></div>`).join('')}</div>
<div class="card"><b>Dans l’année ${y}</b>${AN.slice().sort((a,b)=>a[2]*40+a[3]-b[2]*40-b[3]).map(a=>{const dt=new Date(y,a[2]-1,a[3]),dj=Math.round((dt-n)/864e5),k='y'+y+a[0],dn=S.ck[k];return`<div class="item"><label style="margin:0" class="ck">${ck(k)}<span>${a[1]} <span class="chip ${!dn&&dj>=0&&dj<=30?'w':''}">${dn?'fait':dj<0?'passé':'dans '+dj+' j'}</span><br><span class="mu">${fd(iso(dt))} · ${a[4]}</span></span></label></div>`}).join('')}</div>
<div class="card"><b>Bon à savoir</b><div class="mu">Compte bancaire dédié à l’activité · factures numérotées sans trou · conservation des documents 10 ans · mentions légales sur chaque facture (SIRET, TVA non applicable art. 293 B). Taux et seuils : à vérifier chaque année sur autoentrepreneur.urssaf.fr.</div></div>`}

function vSt(){const s=S.st;return`<h2>Réglages</h2><div class="card"><b>Installer sur l’iPhone</b><ol class="mu"><li>Ouvrez le lien dans <b>Safari</b></li><li>Touchez Partager (carré avec une flèche)</li><li>Choisissez « Sur l’écran d’accueil », puis Ajouter</li><li>Ouvrez l’icône, puis ici : Sauvegarde ▸ Restaurer pour retrouver vos données</li></ol></div><form class="card" id="sf">${inp('nom','Votre nom',s.nom)}${inp('ent','Nom commercial',s.ent)}${inp('siret','SIRET',s.siret)}${inp('adr','Adresse',s.adr)}${inp('tel','Téléphone',s.tel,'tel')}${inp('mail','E-mail',s.mail,'email')}${inp('iban','IBAN (pour les factures)',s.iban)}${sel('freq','Déclaration de CA',[['m','Mensuelle'],['t','Trimestrielle']],s.freq)}<div class="grid">${inp('taux','Cotisations (%)',s.taux,'number','step="0.1"')}${inp('plaf','Plafond CA (€)',s.plaf,'number')}</div>${inp('tva','Seuil franchise TVA (€)',s.tva,'number')}<label>Catalogue (une ligne par prestation : nom;prix)<textarea name="cat">${e(s.cat)}</textarea></label><div class="acts"><button class="p">Enregistrer</button></div><p class="mu">Valeurs par défaut pour la prestation de services (BIC). Vérifiez-les sur urssaf.fr et adaptez si besoin (ACRE, versement libératoire…).</p></form>
<div class="card"><b>💾 Sauvegarde</b><p class="mu">Vos données sont stockées uniquement sur ce téléphone. ${S.bk?'Dernière sauvegarde : <b>'+fd(S.bk)+'</b>'+(bkAge()>=7?' (à refaire)':''):'<b>Aucune sauvegarde faite.</b>'} Un rappel s’affiche sur l’accueil et chaque dimanche dans le calendrier. Faites-la une fois par semaine.</p><div class="acts"><button class="p" data-a="bkf">Sauvegarder (partager)</button><button data-a="bkc">Copier le texte</button></div><textarea id="bk">${e(JSON.stringify(S))}</textarea><p class="mu">Restaurer sur un nouvel appareil :</p><label>Depuis un fichier<input type="file" id="bf" accept=".json,application/json"></label><div class="acts"><button data-a="bki">Restaurer le texte collé</button></div></div>`}

/* ---------- rendu ---------- */
let CM={y:new Date().getFullYear(),m:new Date().getMonth(),s:td()};
const P={d:0,f:1,r:2,o:3},SH={rcp:'RC Pro',sf:'Attestation',ir:'Déclarer impôts',cfe:'Payer CFE',sx:'Seuils',bi:'Bilan',tf:'Tarifs',pr:'Relance clients',au:'Relance clients'};
function vPlus(){const L=[['ag','🗓️','Agenda','Liste de tous mes rendez-vous'],['re','💬','Relances','Messages prêts à envoyer'],['ob','✅','Obligations','Déclarations, impôts, à faire'],['st','⚙️','Réglages','Mes infos, catalogue, sauvegarde']];return`<h2>Plus</h2><p></p>`+L.map(l=>`<a class="card row" style="text-decoration:none;color:inherit" href="#${l[0]}"><span style="font-size:32px">${l[1]}</span><span style="flex:1"><b>${l[2]}</b><div class="mu">${l[3]}</div></span><b>›</b></a>`).join('')}
function evs(d){const o=[],[y,m,dd]=d.split('-').map(Number),last=new Date(y,m,0).getDate(),q=S.st.freq=='t';
S.rdv.filter(r=>r.d==d).forEach(r=>o.push({k:'r',s:'RDV '+r.h.replace(':','h'),t:r.h+' · '+cl(r.c).nom+' – '+r.p}));
S.fa.filter(f=>f.s!='p'&&f.ech==d).forEach(f=>o.push({k:'f',s:'Encaisser',t:'Facture à encaisser : '+cl(f.c).nom+' '+eur(tot(f))}));
if(dd==last&&(!q||[1,4,7,10].includes(m)))o.push({k:'d',s:'Déclarer CA',t:'Déclaration de CA et paiement des cotisations (URSSAF)'});
if(dd==last)o.push({k:'o',s:'Clôture',t:'Clôturer le mois : livre des recettes et achats'});
if(dd==5)o.push({k:'o',s:'Relances',t:'Relancer les impayés'});if(new Date(y,m-1,dd).getDay()==0)o.push({k:'o',s:'Sauvegarde',t:'Sauvegarder l’appli (Réglages ▸ Sauvegarde)'});
AN.forEach(a=>{if(a[2]==m&&a[3]==dd)o.push({k:'o',s:SH[a[0]]||'À faire',t:a[1]})});return o}
function vCa(){const {y,m}=CM,first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=td();let cells='';for(let i=0;i<off;i++)cells+='<i></i>';
for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),ks=evs(k).sort((a,b)=>P[a.k]-P[b.k]);cells+=`<button class="day${k==CM.s?' sel':''}${k==t?' today':''}" data-a="cd" data-id="${k}"><em>${d}</em>${ks.slice(0,2).map(x=>`<span class="t ${x.k}">${x.s}</span>`).join('')}${ks.length>2?`<span class="t o">+${ks.length-2}</span>`:''}</button>`}
const E=evs(CM.s).sort((a,b)=>P[a.k]-P[b.k]),D=nd();
return`<div class="card"><div class="row"><b>À déclarer à l’URSSAF</b><span class="t d lg">${D.days<=0?'Aujourd’hui':'dans '+D.days+' jours'}</span></div><div>Avant le <b>${fd(iso(D.dl))}</b> : <b>${eur(caR(D.a,D.b))}</b> de CA à déclarer</div></div><div class="row"><button data-a="cm" data-id="-1" aria-label="Mois précédent">‹</button><h2>${first.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2><button data-a="cm" data-id="1" aria-label="Mois suivant">›</button></div><div class="cal">${'LMMJVSD'.split('').map(x=>`<small>${x}</small>`).join('')}${cells}</div><div class="mu" style="margin:10px 0"><span class="t r lg">Rendez-vous</span><span class="t d lg">À déclarer</span><span class="t o lg">À faire</span><span class="t f lg">À encaisser</span></div><div class="card"><b>${fd(CM.s)}</b>${E.length?E.map(x=>`<div class="item"><span class="t ${x.k} lg">${x.s}</span> ${e(x.t)}</div>`).join(''):'<div class="empty">Rien de prévu ce jour-là.</div>'}<div class="acts"><button class="p" data-a="rdj">+ Rendez-vous ce jour</button><button data-a="today">Aujourd’hui</button></div></div>`}
const V={home:vHome,ca:vCa,plus:vPlus,cl:vCl,ag:vAg,fa:vFa,re:vRe,ob:vOb,st:vSt};
function render(){if(!V[tab])tab='home';$('#nav').innerHTML=T.map(t=>`<a href="#${t[0]}" class="${t[0]==tab||(t[0]=='plus'&&['ag','re','ob','st'].includes(tab))?'on':''}"><span>${t[2]}</span>${t[1]}</a>`).join('');$('#v').innerHTML=(['ag','re','ob','st'].includes(tab)?'<a href="#plus" class="btn" style="margin-bottom:12px">‹ Retour</a>':'')+V[tab]();
const f=$('#sf');if(f)f.onsubmit=ev=>{ev.preventDefault();const v=Object.fromEntries(new FormData(f));['taux','plaf','tva'].forEach(k=>v[k]=+v[k]);Object.assign(S.st,v);save();render();alert('Réglages enregistrés')}}
addEventListener('hashchange',()=>{tab=location.hash.slice(1)||'home';render();scrollTo(0,0);if(tab=='cl'&&CV=='c')geoAll()});
const flash=(b,t)=>{const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1400)};
const copy=(t,b)=>{try{navigator.clipboard.writeText(t).then(()=>flash(b,'Copié ✓'),()=>0)}catch(x){}};
document.addEventListener('change',ev=>{const t=ev.target;if(t.id=='bf'&&t.files[0]){t.files[0].text().then(tx=>{try{const d=JSON.parse(tx);if(d.st&&d.cl){S=Object.assign({},DEF,d);save();render();alert('Données restaurées')}else alert('Fichier invalide')}catch(x){alert('Fichier invalide')}})}if(t.id=='rt'){RL.t=+t.value;render()}if(t.id=='rc'){RL.c=t.value;RL.f='';render()}if(t.id=='rf'){RL.f=t.value;render()}if(t.dataset.a=='ck'){S.ck[t.dataset.id]=t.checked;save();render()}});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.type=='checkbox')return;const a=b.dataset.a,id=b.dataset.id,m=$('#mo'),c=S.cl.find(x=>x.id==RL.c)||{};
const A={shut,sub:()=>{sub=id;render()},cv:()=>{CV=id;render();if(id=='c')geoAll()},geoall:()=>geoAll(true),mf:()=>{MF=id;render()},pin:()=>{MS=id;render()},geo:()=>{navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{const f=$('#mo form');f.lat.value=p.coords.latitude;f.lng.value=p.coords.longitude;$('#gs').textContent='Position enregistrée ✓'},()=>alert('Position indisponible : autorisez la localisation pour ce site.')):alert('Localisation non disponible')},cm:()=>{let mm=CM.m+ +id,yy=CM.y;if(mm<0){mm=11;yy--}if(mm>11){mm=0;yy++}CM={y:yy,m:mm,s:yy+'-'+pad(mm+1)+'-01'};render()},cd:()=>{CM.s=id;render()},rdj:()=>{window._pd=CM.s;fRd()},today:()=>{const n=new Date();CM={y:n.getFullYear(),m:n.getMonth(),s:td()};render()},hint:()=>{S.hint=1;save();render()},ecl:()=>fCl(id),erd:()=>fRd(id),efa:()=>fFa(),vfa:()=>vFacture(id),
rfa:()=>{const r=S.rdv.find(x=>x.id==id);fFa({c:r.c,rid:r.id,l:[{t:r.p,q:1,p:r.pr}]})},
dcl:()=>{if(confirm('Supprimer ce client ?')){S.cl=S.cl.filter(x=>x.id!=window._id);save();shut()}},
drd:()=>{if(confirm('Supprimer ce rendez-vous ?')){S.rdv=S.rdv.filter(x=>x.id!=window._id);save();shut()}},
dfa:()=>{if(confirm('Supprimer cette facture ?')){S.fa=S.fa.filter(x=>x.id!=id);S.rdv.forEach(r=>{if(r.fid==id)delete r.fid});save();shut()}},
pay:()=>{S.fa.find(x=>x.id==id).s='p';S.fa.find(x=>x.id==id).dp=td();save();shut()},
rel:()=>{const f=S.fa.find(x=>x.id==id);RL={t:f.ech<td()?3:2,c:f.c,f:f.id};m.hidden=true;location.hash='re';render()},
cp:()=>copy(m._t,b),cpx:()=>copy($('#rx').value,b),
sms:()=>location.href='sms:'+c.tel+'?&body='+encodeURIComponent($('#rx').value),
wa:()=>open('https://wa.me/'+c.tel.replace(/\D/g,'').replace(/^0/,'33')+'?text='+encodeURIComponent($('#rx').value),'_blank'),
ml:()=>location.href='mailto:'+c.mail+'?body='+encodeURIComponent($('#rx').value),
ede:()=>modal(`<h3>Nouvel achat</h3><form>${inp('d','Date',td(),'date','required')}${inp('l','Libellé','','text','required')}${inp('m','Montant (€)','','number','step="0.01" required')}${sel('k','Catégorie',['Produits','Matériel','Carburant','Assurance','Autre'])}${foot()}</form>`,v=>{S.de.push(Object.assign({id:uid()},v));save()}),
dde:()=>{S.de=S.de.filter(x=>x.id!=id);save();render()},
bkf:()=>doBk(),bkc:()=>{S.bk=td();save();$('#bk').value=JSON.stringify(S);copy($('#bk').value,b)},
bki:()=>{try{const d=JSON.parse($('#bk').value);if(d.st&&d.cl){S=Object.assign({},DEF,d);save();render();alert('Données restaurées')}}catch(x){alert('Texte invalide')}}};
A[a]&&A[a]()});
tab=location.hash.slice(1)||'home';render();if(tab=='cl'&&CV=='c')geoAll();
function icon(){const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ICON;document.head.appendChild(l)}
icon();
</script></body></html>
